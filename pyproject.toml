[project]
name = "record-once-replay-many"
version = "0.1.0"
description = "Discover Once, Replay Many — computer-use automation for API-less back-office UIs"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "playwright>=1.40",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
